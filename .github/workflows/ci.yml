name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Deployment checks and later jobs (e2e, migrate, deploy-trigger) depend on this job name.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # A migration file merged to main never changes (architecture §3.4). Fetches main (with
      # history, for the merge base) because the checkout above is shallow.
      - name: Merged migrations unchanged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-migrations.mjs --fetch
      - name: Lint and format (Biome)
        run: pnpm exec biome ci --reporter=github .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Builds the web app first, while no package dist exists (the clean-clone next build smoke
      # test), then packages and the api with tsc -b.
      - name: Build
        run: pnpm build
