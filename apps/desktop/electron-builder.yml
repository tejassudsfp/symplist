# Packaging for the Symplist desktop app. macOS first, Windows after; nothing here is macOS-only except
# the `mac` block and the dmg it produces.
appId: com.tejassuds.symplist
productName: Symplist
copyright: Copyright (c) Tejas Parthasarathi Sudarshan
directories:
  output: release
  # Not the default "build": that directory holds the staged web server, which is packaging input, not
  # packaging resources. `resources/icon.png` is the brand mark (apps/web/public/brand/icon.svg
  # rendered at 1024), from which electron-builder derives the .icns. Without it the app ships
  # Electron's own logo, which is what it did before this was exported.
  buildResources: resources

# Main and preload are bundled to single files, so the app carries no node_modules at all — which is the
# only way to pack a pnpm workspace without walking its symlink farm.
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  # Native addons cannot be loaded from inside an archive. Nothing ships one yet; the dsh runtime will.
  - '**/*.node'
# Everything under Resources sits on real disk, outside the asar: Next's standalone server resolves its
# own files at runtime, and the dsh harness will need the same.
#
# The whole of `build/` is copied as one mapping — rather than `build/web -> web` and
# `build/harness -> harness`, which is what it says and what it did not do. app-builder-lib's
# `createFilter` opens with `if (relative === "node_modules") return false`, unconditionally and before
# any pattern is consulted, so a `node_modules` directory sitting at the root of a `from` can never be
# copied and no `filter` can re-include it. Both trees keep everything they need in exactly that place:
# `build/web/node_modules/.pnpm` is what `apps/web/node_modules/next` points at, and
# `build/harness/node_modules` is the 230-package dsh installation. Copying them one level up makes
# their relative paths `web/node_modules` and `harness/node_modules`, which the same function lets
# through. It was not a silent loss either way — it shipped an app that died on `Cannot find module
# 'next'` before the window had anything to show.
#
# `build/` holds nothing but these two staged trees, and anything staged there later wants shipping too,
# so the broader mapping is also the more honest one.
#
# The harness stays outside `app.asar` because four of its packages load Node-API addons from disk and a
# `.node` file cannot be read out of an archive; it is installed with npm rather than pnpm because
# electron-builder cannot pack a symlink farm. `launch-acp.mjs` sits at its root, beside
# `node_modules`, which is how it resolves dsh.
extraResources:
  - from: build
    to: .
npmRebuild: false
electronLanguages:
  - en

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  # Unsigned, deliberately, for phase 2: no Developer ID exists yet. `null` means electron-builder does
  # not look for an identity, so the build is reproducible on any machine — and the result is
  # quarantined on download, which README.md tells the user how to clear.
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  category: public.app-category.productivity

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Not built or tested yet; it is here so nothing in the configuration assumes macOS.
win:
  target:
    - target: nsis
      arch:
        - x64
