# Packaging for the Symplist desktop app. macOS first, Windows after; nothing here is macOS-only except
# the `mac` block and the dmg it produces.
appId: com.tejassuds.symplist
productName: Symplist
copyright: Copyright (c) Tejas Parthasarathi Sudarshan
directories:
  output: release
  # Not the default "build": that directory holds the staged web server, which is packaging input, not
  # packaging resources. `resources/icon.png` is the brand mark (apps/web/public/brand/icon.svg
  # rendered at 1024), from which electron-builder derives the .icns. Without it the app ships
  # Electron's own logo, which is what it did before this was exported.
  buildResources: resources

# Main and preload are bundled to single files, so the app carries no node_modules at all — which is the
# only way to pack a pnpm workspace without walking its symlink farm.
files:
  - dist/**/*
  - package.json
asar: true
# Everything under Resources sits on real disk, outside the asar, because Next's standalone server
# resolves its own files at runtime.
#
# The whole of `build/` is copied as one mapping — rather than `build/web -> web`, which is what it says
# and what it did not do. app-builder-lib's `createFilter` opens with
# `if (relative === "node_modules") return false`, unconditionally and before any pattern is consulted,
# so a `node_modules` directory sitting at the root of a `from` can never be copied and no `filter` can
# re-include it. The staged tree keeps everything it needs in exactly that place:
# `build/web/node_modules/.pnpm` is what `apps/web/node_modules/next` points at. Copying it one level up
# makes its relative path `web/node_modules`, which the same function lets through. It was not a silent
# loss either way — it shipped an app that died on `Cannot find module 'next'` before the window had
# anything to show.
#
# `build/` holds nothing but that staged tree, and anything staged there later wants shipping too, so the
# broader mapping is also the more honest one.
extraResources:
  - from: build
    to: .
npmRebuild: false
electronLanguages:
  - en

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  # This is the released configuration: signed with a Developer ID, hardened, and notarized by Apple.
  #
  # A machine without those credentials cannot produce it, and `scripts/package.mjs` turns all of this
  # off for that machine rather than failing — see `src/packaging/signing.ts`, which also makes the
  # script say which of the two builds it made. The entitlements are the two V8 needs under the hardened
  # runtime; without them a signed build crashes as the renderer starts.
  notarize: true
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  darkModeSupport: true
  category: public.app-category.productivity

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # electron-builder signs the .app and then wraps it, leaving the disk image itself unsigned — and an
  # unsigned image is what Gatekeeper is handed first on a download. `spctl` reported "no usable
  # signature" on the first signed build for exactly that reason, while the app inside was fine.
  # Apple's guidance is to sign the image too, so it is signed, notarized and stapled in its own right.
  sign: true

# Not built or tested yet; it is here so nothing in the configuration assumes macOS.
win:
  target:
    - target: nsis
      arch:
        - x64
